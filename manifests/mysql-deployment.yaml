apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    # Application grouping and icon in the OpenShift console Topology view
    app.kubernetes.io/part-of: fruit-database-app
    app.openshift.io/runtime: mysql-database
spec:
  selector:
    matchLabels:
      name: mysql
  template:
    metadata:
      labels:
        name: mysql
    spec:
      containers:
        - name: mysql
          image: registry.redhat.io/rhel8/mysql-80:latest
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-name
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin -u $MYSQL_USER ping
