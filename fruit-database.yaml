# All manifests from manifests/ in one file. Deploy with: oc apply -f fruit-database.yaml
# or paste into Import YAML in the OpenShift console.
---
# Source: manifests/mysql-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mysql
stringData:
  database-name: fruitdb
  # Must match the %prod datasource credentials in the fruit-database application.properties
  database-user: myuser
  database-password: mypassword
  database-root-password: mypassword
---
# Source: manifests/mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    # Application grouping and icon in the OpenShift console Topology view
    app.kubernetes.io/part-of: fruit-database-app
    app.openshift.io/runtime: mysql-database
spec:
  selector:
    matchLabels:
      name: mysql
  template:
    metadata:
      labels:
        name: mysql
    spec:
      containers:
        - name: mysql
          image: registry.redhat.io/rhel8/mysql-80:latest
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: database-name
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin -u $MYSQL_USER ping
---
# Source: manifests/mysql-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    name: mysql
  ports:
    - port: 3306
---
# Source: manifests/fruit-database-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-database
  labels:
    # Application grouping and icon in the OpenShift console Topology view
    app.kubernetes.io/part-of: fruit-database-app
    app.openshift.io/runtime: quarkus
  annotations:
    # Draws an arrow to MySQL in the OpenShift console Topology view
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"mysql"}]'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fruit-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fruit-database
    spec:
      containers:
        - name: fruit-database
          image: quay.io/mostmark/fruit-database:1.0
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
---
# Source: manifests/fruit-database-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: fruit-database
spec:
  selector:
    app.kubernetes.io/name: fruit-database
  ports:
    - port: 80
      targetPort: 8080
---
# Source: manifests/fruit-database-route.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fruit-database
spec:
  to:
    kind: Service
    name: fruit-database
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Source: manifests/networkpolicy-deny-all-incoming.yaml
# Selects every pod in the namespace and allows no incoming traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-incoming
spec:
  podSelector: {}
---
# Source: manifests/networkpolicy-allow-from-openshift-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fruit-database
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
---
# Source: manifests/networkpolicy-allow-app-to-mysql.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-mysql
spec:
  podSelector:
    matchLabels:
      name: mysql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fruit-database
      ports:
        - port: 3306
